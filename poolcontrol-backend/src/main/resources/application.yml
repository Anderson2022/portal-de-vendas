spring:
  application:
    name: poolcontrol-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/poolcontrol}
    username: ${DB_USER:poolcontrol}
    password: ${DB_PASSWORD:poolcontrol}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

poolcontrol:
  jwt:
    secret: ${JWT_SECRET:dev-poolcontrol-secret-key-change-me-123456789}
    issuer: poolcontrol-api
    expiration-minutes: 480
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    company-name: ${BOOTSTRAP_COMPANY:Piscinas Azul LTDA}
    admin-email: ${BOOTSTRAP_EMAIL:admin@poolcontrol.local}
    admin-password: ${BOOTSTRAP_PASSWORD:Admin@123}
